<style>
:root{color-scheme:light;--ink:#162b37;--muted:#41616c;--accent:#0a6172;--line:#d9e5e8}
body{max-width:68rem;margin:0 auto;padding:2.5rem 1.25rem 5rem;color:var(--ink);background:#fff;font:16px/1.64 system-ui,sans-serif}
header{background:#eff7f8;border-top:5px solid var(--accent);padding:1.6rem 2rem;margin-bottom:1.8rem}
header h1{margin:0;font-size:clamp(2rem,5vw,3.3rem);letter-spacing:-.045em;line-height:1.15}
.subtitle,.author,.date{color:var(--muted);margin:.5rem 0}
#TOC{background:#f6f9fa;padding:.9rem 1rem;border:1px solid var(--line);border-radius:.4rem}
#TOC ul{margin:.15rem 0;padding-left:1.25rem}
a{color:var(--accent);text-underline-offset:.17em}
h1,h2{line-height:1.25;margin-top:2rem} h1{border-bottom:1px solid var(--line);padding-bottom:.5rem} header h1{border:0;padding:0}
table{width:100%;border-collapse:collapse;margin:1.2rem 0}
td,th{text-align:left;vertical-align:top;padding:.52rem .66rem;border-bottom:1px solid var(--line)}
th{background:#e8f3f4} tbody tr:nth-child(even){background:#f8fbfc}
code{background:#eef4f5;padding:.12rem .22rem;overflow-wrap:anywhere} pre{padding:1rem;background:#f3f7f8;overflow:auto} pre code{padding:0;background:none;overflow-wrap:normal}
@media(max-width:650px){table{display:block;overflow-x:auto} td,th{min-width:7rem}}
</style>
